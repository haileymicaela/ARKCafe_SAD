<nav class="system-pagination" aria-label="NCR record pages">
  {% if page_obj.has_previous %}<a href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">Prev</a>
  {% else %}<span class="is-disabled">Prev</span>{% endif %}
  {% if page_obj.has_next %}<a class="next-page" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Next</a>
  {% else %}<span class="next-page is-disabled">Next</span>{% endif %}
</nav>
