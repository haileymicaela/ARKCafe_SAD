$kind: http-request
name: "Teardown: logout staff"
url: "{{baseUrl}}/logout"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Logout redirects', () => pm.expect([200, 302]).to.include(pm.response.code));
    language: text/javascript
settings:
  followRedirects: false
order: 12000
