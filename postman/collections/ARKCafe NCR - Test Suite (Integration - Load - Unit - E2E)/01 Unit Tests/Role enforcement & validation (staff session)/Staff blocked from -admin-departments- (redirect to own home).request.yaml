$kind: http-request
name: Staff blocked from /admin-departments/ (redirect to own home)
url: "{{baseUrl}}/admin-departments"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 302', () => pm.expect(pm.response.code).to.eql(302));
      const loc = pm.response.headers.get('Location') || '';
      pm.test('Sent to staff dashboard', () => pm.expect(loc).to.include('/staff-dashboard/'));
    language: text/javascript
settings:
  followRedirects: false
order: 5000
