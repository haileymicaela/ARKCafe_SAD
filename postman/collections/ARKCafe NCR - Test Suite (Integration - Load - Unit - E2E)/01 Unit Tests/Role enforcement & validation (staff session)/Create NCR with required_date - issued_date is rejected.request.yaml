$kind: http-request
name: Create NCR with required_date < issued_date is rejected
url: "{{baseUrl}}/staff-create"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    project: "{{projectId}}"
    department: "{{departmentId}}"
    cause: material
    subject: Unit test dates
    issued_date: 2026-05-10
    required_date: 2026-05-01
scripts:
  - type: afterResponse
    code: |-
      pm.test('Form re-renders with 200', () => pm.expect(pm.response.code).to.eql(200));
      pm.test('Date-order error shown', () => pm.expect(pm.response.text()).to.include('earlier than'));
    language: text/javascript
order: 10000
