$kind: http-request
name: Staff blocked from /admin-dashboard/ (redirect to own home)
url: "{{baseUrl}}/admin-dashboard"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 302', () => pm.expect(pm.response.code).to.eql(302));
      const loc = pm.response.headers.get('Location') || '';
      pm.test('Sent to staff dashboard, not admin page', () => pm.expect(loc).to.include('/staff-dashboard/'));
    language: text/javascript
settings:
  followRedirects: false
order: 3000
