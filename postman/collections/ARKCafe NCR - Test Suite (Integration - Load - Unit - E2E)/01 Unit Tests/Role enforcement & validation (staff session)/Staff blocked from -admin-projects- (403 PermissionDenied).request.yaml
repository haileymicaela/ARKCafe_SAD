$kind: http-request
name: Staff blocked from /admin-projects/ (403 PermissionDenied)
url: "{{baseUrl}}/admin-projects"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', () => pm.expect(pm.response.code).to.eql(403));
    language: text/javascript
settings:
  followRedirects: false
order: 4000
