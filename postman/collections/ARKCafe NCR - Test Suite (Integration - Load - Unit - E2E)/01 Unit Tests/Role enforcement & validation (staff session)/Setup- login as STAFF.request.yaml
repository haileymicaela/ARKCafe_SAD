$kind: http-request
name: "Setup: login as STAFF"
url: "{{baseUrl}}/login"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    username: "{{staffEmail}}"
    password: "{{staffPassword}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login redirects (302)', () => pm.expect(pm.response.code).to.eql(302));
      const loc = pm.response.headers.get('Location') || '';
      pm.test('Staff goes to staff dashboard', () => pm.expect(loc).to.include('staff-dashboard'));
      pm.test('sessionid cookie present', () => pm.expect(!!pm.cookies.get('sessionid')).to.be.true);
    language: text/javascript
settings:
  followRedirects: false
order: 2000
