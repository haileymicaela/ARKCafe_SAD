$kind: http-request
name: Staff can open /staff-records/ (captures project & department IDs)
description: Requires seed data (project + department). If this fails, run the Admin CRUD chain in 02 Integration first.
url: "{{baseUrl}}/staff-records"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Records list returns 200', () => pm.expect(pm.response.code).to.eql(200));
      const body = pm.response.text();
      pm.test('Page renders the project filter', () => pm.expect(body).to.include('name="project"'));
      // capture first valid project/department ids from the filter selects for the validation tests below
      const pSel = body.match(/name="project"[\s\S]*?<\/select>/);
      const pOpt = pSel && pSel[0].match(/<option value="(\d+)"/);
      const dSel = body.match(/name="department"[\s\S]*?<\/select>/);
      const dOpt = dSel && dSel[0].match(/<option value="(\d+)"/);
      if (pOpt) pm.collectionVariables.set('projectId', pOpt[1]);
      if (dOpt) pm.collectionVariables.set('departmentId', dOpt[1]);
      pm.test('Seed data found: at least 1 project and 1 department', () => pm.expect(!!pOpt && !!dOpt).to.be.true);
    language: text/javascript
order: 7000
