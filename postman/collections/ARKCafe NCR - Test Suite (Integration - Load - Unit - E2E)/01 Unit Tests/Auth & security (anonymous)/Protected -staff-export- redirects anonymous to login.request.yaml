$kind: http-request
name: Protected /staff/export/ redirects anonymous to login
url: "{{baseUrl}}/staff/export"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 302', () => pm.expect(pm.response.code).to.eql(302));
      const loc = pm.response.headers.get('Location') || '';
      pm.test('Redirects to login', () => pm.expect(loc).to.include('/login/'));
    language: text/javascript
settings:
  followRedirects: false
order: 6000
