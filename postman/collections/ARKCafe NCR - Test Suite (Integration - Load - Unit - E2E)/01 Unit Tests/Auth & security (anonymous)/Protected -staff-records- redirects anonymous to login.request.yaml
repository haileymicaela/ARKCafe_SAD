$kind: http-request
name: Protected /staff-records/ redirects anonymous to login
url: "{{baseUrl}}/staff-records"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 302', () => pm.expect(pm.response.code).to.eql(302));
      const loc = pm.response.headers.get('Location') || '';
      pm.test('Redirects to login with next param', () => pm.expect(loc).to.include('/login/') && pm.expect(loc).to.include('next='));
    language: text/javascript
settings:
  followRedirects: false
order: 4000
