$kind: http-request
description: POST is required by Django 5+ LogoutView. Clears the session so the tests below run anonymously.
url: "{{baseUrl}}/logout"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Logout accepted (redirect)', () => pm.expect([200, 302]).to.include(pm.response.code));
    language: text/javascript
settings:
  followRedirects: false
order: 1000
