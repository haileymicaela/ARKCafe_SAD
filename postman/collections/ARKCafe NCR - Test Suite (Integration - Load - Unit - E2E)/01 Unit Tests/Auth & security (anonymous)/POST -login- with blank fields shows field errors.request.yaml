$kind: http-request
name: POST /login/ with blank fields shows field errors
url: "{{baseUrl}}/login"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    username: ""
    password: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('Form re-renders with 200', () => pm.expect(pm.response.code).to.eql(200));
      pm.test('Shows required-field errors', () => pm.expect(pm.response.text()).to.include('This field is required'));
    language: text/javascript
order: 10000
