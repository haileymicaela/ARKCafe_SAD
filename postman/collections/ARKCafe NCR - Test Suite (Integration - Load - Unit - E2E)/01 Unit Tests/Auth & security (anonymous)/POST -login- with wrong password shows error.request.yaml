$kind: http-request
name: POST /login/ with wrong password shows error
url: "{{baseUrl}}/login"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    username: "{{adminEmail}}"
    password: definitely-wrong-password
scripts:
  - type: afterResponse
    code: |-
      pm.test('Form re-renders with 200', () => pm.expect(pm.response.code).to.eql(200));
      pm.test('Shows invalid-login message', () => pm.expect(pm.response.text()).to.include('Incorrect email or password'));
    language: text/javascript
order: 9000
