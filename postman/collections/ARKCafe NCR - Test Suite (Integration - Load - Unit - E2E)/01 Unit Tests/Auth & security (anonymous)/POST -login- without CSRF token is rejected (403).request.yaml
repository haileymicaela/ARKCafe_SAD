$kind: http-request
name: POST /login/ without CSRF token is rejected (403)
description: Deliberately omits the X-CSRFToken header - Django must answer 403 CSRF failure.
url: "{{baseUrl}}/login"
method: POST
body:
  type: urlencoded
  content:
    username: "{{adminEmail}}"
    password: whatever
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 403', () => pm.expect(pm.response.code).to.eql(403));
      pm.test('Body mentions CSRF failure', () => pm.expect(pm.response.text()).to.include('CSRF'));
    language: text/javascript
settings:
  followRedirects: false
order: 8000
