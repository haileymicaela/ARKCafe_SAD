$kind: http-request
url: "{{baseUrl}}/staff-records/999999/attachments/1"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 302 (auth check runs before 404)', () => pm.expect(pm.response.code).to.eql(302));
      const loc = pm.response.headers.get('Location') || '';
      pm.test('Redirects to login', () => pm.expect(loc).to.include('/login/'));
    language: text/javascript
settings:
  followRedirects: false
order: 7000
