$kind: http-request
name: GET /login/ (fresh CSRF each iteration)
description: Required at the start of each iteration so the POST below has a fresh CSRF token.
url: "{{baseUrl}}/login"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Login page 200', () => pm.expect(pm.response.code).to.eql(200));
    language: text/javascript
order: 1000
