$kind: http-request
url: "{{baseUrl}}/admin-departments"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    action: add
    add-department_name: "{{departmentName}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('departmentName', 'E2E Dept ' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: pm.test('Department created (302)', () => pm.expect(pm.response.code).to.eql(302));
    language: text/javascript
settings:
  followRedirects: false
order: 6000
