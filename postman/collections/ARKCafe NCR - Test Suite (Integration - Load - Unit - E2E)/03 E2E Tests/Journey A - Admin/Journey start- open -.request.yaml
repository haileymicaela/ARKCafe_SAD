$kind: http-request
name: "Journey start: open /"
description: Follows the redirect chain / -> /login/ like a real browser visit.
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Anonymous root lands on login page', () =>
        pm.expect(pm.response.code).to.eql(200) &&
        pm.expect(pm.response.text()).to.include('name="username"'));
    language: text/javascript
order: 1000
