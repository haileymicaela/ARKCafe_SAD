$kind: http-request
url: "{{baseUrl}}/login"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    username: "{{adminEmail}}"
    password: "{{adminPassword}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Redirected to admin dashboard', () =>
        pm.expect(pm.response.code).to.eql(302) &&
        pm.expect(pm.response.headers.get('Location') || '').to.include('admin-dashboard'));
    language: text/javascript
settings:
  followRedirects: false
order: 2000
