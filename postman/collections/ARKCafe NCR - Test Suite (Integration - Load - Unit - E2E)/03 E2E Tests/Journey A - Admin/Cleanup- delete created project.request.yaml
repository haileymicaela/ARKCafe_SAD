$kind: http-request
name: "Cleanup: delete created project"
url: "{{baseUrl}}/admin-projects/{{projectId}}/delete"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Project deleted (302)', () => pm.expect(pm.response.code).to.eql(302));
    language: text/javascript
settings:
  followRedirects: false
order: 10000
