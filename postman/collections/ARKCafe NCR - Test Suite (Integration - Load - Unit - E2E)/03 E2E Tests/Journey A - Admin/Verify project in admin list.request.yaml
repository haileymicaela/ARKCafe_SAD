$kind: http-request
url: "{{baseUrl}}/admin-projects/?q={{projectCode}}"
method: GET
queryParams:
  q: "{{projectCode}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Project visible in list', () => pm.expect(pm.response.text()).to.include(pm.collectionVariables.get('projectCode')));
      const m = pm.response.text().match(/admin-projects\/(\d+)\/edit\//);
      if (m) pm.collectionVariables.set('projectId', m[1]);
    language: text/javascript
order: 7000
