$kind: http-request
name: "Journey end: logout"
url: "{{baseUrl}}/logout"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Logged out (302)', () => pm.expect([200, 302]).to.include(pm.response.code));
    language: text/javascript
settings:
  followRedirects: false
order: 12000
