$kind: http-request
url: "{{baseUrl}}/staff-create"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    project: "{{projectId}}"
    department: "{{departmentId}}"
    package_no: PKG-{{uniq}}
    cause: workmanship
    subject: E2E staff journey NCR {{uniq}}
    issued_date: 2026-01-20
    required_date: 2026-02-20
    description: Raised end-to-end by the staff journey
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('uniq', Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('NCR created (302)', () => pm.expect(pm.response.code).to.eql(302));
      const m = (pm.response.headers.get('Location') || '').match(/staff-records\/(\d+)\//);
      pm.test('Sent to NCR detail', () => pm.expect(!!m).to.be.true);
      if (m) pm.collectionVariables.set('ncrId', m[1]);
    language: text/javascript
settings:
  followRedirects: false
order: 5000
