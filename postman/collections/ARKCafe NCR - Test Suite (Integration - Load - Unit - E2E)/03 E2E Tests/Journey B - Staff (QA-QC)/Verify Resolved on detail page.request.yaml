$kind: http-request
url: "{{baseUrl}}/staff-records/{{ncrId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status Resolved visible', () => pm.expect(pm.response.text()).to.include('Resolved'));
      pm.test('Resolution history logged', () => pm.expect(pm.response.text()).to.match(/E2E journey/));
    language: text/javascript
order: 9000
