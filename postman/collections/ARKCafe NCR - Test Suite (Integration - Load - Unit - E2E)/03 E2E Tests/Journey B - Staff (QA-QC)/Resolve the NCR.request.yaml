$kind: http-request
url: "{{baseUrl}}/staff-records/{{ncrId}}"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    new_status: resolved
    resolution_type: reapproved
    resolution_note: Approved after rework
    remarks: E2E journey
scripts:
  - type: afterResponse
    code: pm.test('Resolved (302)', () => pm.expect(pm.response.code).to.eql(302));
    language: text/javascript
settings:
  followRedirects: false
order: 8000
