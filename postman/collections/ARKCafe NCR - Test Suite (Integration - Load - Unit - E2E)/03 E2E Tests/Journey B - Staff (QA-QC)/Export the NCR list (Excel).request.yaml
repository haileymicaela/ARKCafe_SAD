$kind: http-request
url: "{{baseUrl}}/staff/export"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: formdata
  content:
    - type: text
      key: export_type
      value: excel
    - type: text
      key: columns
      value: reference_no
    - type: text
      key: columns
      value: subject
    - type: text
      key: columns
      value: status
scripts:
  - type: afterResponse
    code: |-
      pm.test('Export 200', () => pm.expect(pm.response.code).to.eql(200));
      pm.test('xlsx content type', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('spreadsheetml'));
    language: text/javascript
order: 11000
