$kind: http-request
url: "{{baseUrl}}/admin-projects/?q={{projectCode}}"
method: GET
queryParams:
  q: "{{projectCode}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Project list 200', () => pm.expect(pm.response.code).to.eql(200));
      const id = pm.collectionVariables.get('projectId');
      pm.test('Project no longer listed', () => pm.expect(pm.response.text()).to.not.include('admin-projects/' + id + '/edit/'));
    language: text/javascript
order: 6000
