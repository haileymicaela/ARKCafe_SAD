$kind: http-request
url: "{{baseUrl}}/admin-projects/add"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    project_name: "{{projectName}}"
    client_name: Integration Client
    project_code: "{{projectCode}}"
    description: Created by Postman integration test
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('projectCode', 'PT-' + Date.now());
      pm.collectionVariables.set('projectName', 'Postman Integration Project');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Add project redirects (302)', () => pm.expect(pm.response.code).to.eql(302));
      pm.test('Redirects back to project list', () => pm.expect(pm.response.headers.get('Location') || '').to.include('/admin-projects'));
    language: text/javascript
settings:
  followRedirects: false
order: 1000
