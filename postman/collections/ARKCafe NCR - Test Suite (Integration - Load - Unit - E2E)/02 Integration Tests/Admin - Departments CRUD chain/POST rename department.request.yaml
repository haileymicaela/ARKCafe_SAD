$kind: http-request
url: "{{baseUrl}}/admin-departments"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    action: rename
    department_id: "{{departmentId}}"
    rename-department_name: "{{departmentName}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('departmentName', pm.collectionVariables.get('departmentName') + ' RENAMED');
    language: text/javascript
  - type: afterResponse
    code: pm.test('Rename redirects (302)', () => pm.expect(pm.response.code).to.eql(302));
    language: text/javascript
settings:
  followRedirects: false
order: 3000
