$kind: http-request
url: "{{baseUrl}}/login"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    username: "{{adminEmail}}"
    password: "{{adminPassword}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login redirects (302)', () => pm.expect(pm.response.code).to.eql(302));
      const loc = pm.response.headers.get('Location') || '';
      pm.test('Admin goes to admin dashboard', () => pm.expect(loc).to.include('admin-dashboard'));
      pm.test('sessionid cookie issued', () => pm.expect(!!pm.cookies.get('sessionid')).to.be.true);
    language: text/javascript
settings:
  followRedirects: false
order: 2000
