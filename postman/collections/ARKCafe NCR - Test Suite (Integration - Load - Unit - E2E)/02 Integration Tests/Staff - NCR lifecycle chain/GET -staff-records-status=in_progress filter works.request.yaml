$kind: http-request
name: GET /staff-records/?status=in_progress filter works
description: Content check that the status filter renders a narrowed list.
url: "{{baseUrl}}/staff-records/?status=in_progress"
method: GET
queryParams:
  status: in_progress
scripts:
  - type: afterResponse
    code: pm.test('Filtered list 200', () => pm.expect(pm.response.code).to.eql(200));
    language: text/javascript
order: 16000
