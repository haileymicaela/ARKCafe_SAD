$kind: http-request
url: "{{baseUrl}}/staff-records/{{ncrId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Detail page 200', () => pm.expect(pm.response.code).to.eql(200));
      const body = pm.response.text();
      pm.test('Reference number auto-generated (NCR-...)', () => pm.expect(body).to.match(/NCR-\d{4}-\d{4}/));
      pm.test('Initial status is Open', () => pm.expect(body).to.include('Open'));
      pm.test('Subject saved', () => pm.expect(body).to.include('Postman integration NCR ' + pm.collectionVariables.get('uniq')));
    language: text/javascript
order: 5000
