$kind: http-request
name: POST resolve NCR (in_progress -> resolved, with resolution type)
url: "{{baseUrl}}/staff-records/{{ncrId}}"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    new_status: resolved
    resolution_type: closed
    resolution_note: Fixed and re-approved
    remarks: Resolved by Postman
scripts:
  - type: afterResponse
    code: pm.test('Resolve redirects (302)', () => pm.expect(pm.response.code).to.eql(302));
    language: text/javascript
settings:
  followRedirects: false
order: 9000
