$kind: http-request
url: "{{baseUrl}}/staff-create"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    project: "{{projectId}}"
    department: "{{departmentId}}"
    package_no: PKG-{{uniq}}
    cause: material
    subject: Postman integration NCR {{uniq}}
    issued_date: 2026-01-15
    required_date: 2026-02-15
    description: NCR created by the Postman integration suite
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('uniq', Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Create NCR redirects (302)', () => pm.expect(pm.response.code).to.eql(302));
      const loc = pm.response.headers.get('Location') || '';
      const m = loc.match(/staff-records\/(\d+)\//);
      pm.test('Redirects to the new NCR detail page', () => pm.expect(!!m).to.be.true);
      if (m) pm.collectionVariables.set('ncrId', m[1]);
    language: text/javascript
settings:
  followRedirects: false
order: 4000
