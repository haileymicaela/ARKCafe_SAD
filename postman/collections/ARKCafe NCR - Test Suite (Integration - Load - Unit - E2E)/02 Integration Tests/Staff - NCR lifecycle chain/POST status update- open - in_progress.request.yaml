$kind: http-request
name: "POST status update: open -> in_progress"
url: "{{baseUrl}}/staff-records/{{ncrId}}"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: urlencoded
  content:
    new_status: in_progress
    remarks: WIP by Postman integration test
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status update redirects (302)', () => pm.expect(pm.response.code).to.eql(302));
      pm.test('Redirects back to detail', () => pm.expect(pm.response.headers.get('Location') || '').to.include('/staff-records/'));
    language: text/javascript
settings:
  followRedirects: false
order: 7000
