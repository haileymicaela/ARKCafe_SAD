$kind: http-request
name: GET /staff-records/?q= filter works
url: "{{baseUrl}}/staff-records/?q=Postman integration NCR {{uniq}}"
method: GET
queryParams:
  q: Postman integration NCR {{uniq}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Filtered list 200', () => pm.expect(pm.response.code).to.eql(200));
      pm.test('Created NCR matches the search', () => pm.expect(pm.response.text()).to.include('Postman integration NCR ' + pm.collectionVariables.get('uniq')));
    language: text/javascript
order: 15000
