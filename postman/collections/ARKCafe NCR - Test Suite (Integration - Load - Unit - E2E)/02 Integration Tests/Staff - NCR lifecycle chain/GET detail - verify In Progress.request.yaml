$kind: http-request
url: "{{baseUrl}}/staff-records/{{ncrId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Detail page 200', () => pm.expect(pm.response.code).to.eql(200));
      pm.test('Status shows In Progress', () => pm.expect(pm.response.text()).to.include('In Progress'));
    language: text/javascript
order: 8000
