$kind: http-request
url: "{{baseUrl}}/staff/export"
method: POST
headers:
  X-CSRFToken: "{{csrfToken}}"
body:
  type: formdata
  content:
    - type: text
      key: export_type
      value: excel
    - type: text
      key: columns
      value: reference_no
    - type: text
      key: columns
      value: subject
    - type: text
      key: columns
      value: project
    - type: text
      key: columns
      value: cause
    - type: text
      key: columns
      value: status
    - type: text
      key: columns
      value: issued_date
scripts:
  - type: afterResponse
    code: |-
      pm.test('Export returns 200', () => pm.expect(pm.response.code).to.eql(200));
      const ct = (pm.response.headers.get('Content-Type') || '');
      pm.test('Response is an xlsx file', () => pm.expect(ct).to.include('spreadsheetml'));
      pm.test('Content-Disposition is an attachment', () =>
        pm.expect(pm.response.headers.get('Content-Disposition') || '').to.include('attachment'));
    language: text/javascript
order: 18000
