$kind: http-request
name: GET /admin-dashboard/ after logout is rejected
url: "{{baseUrl}}/admin-dashboard"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Session invalidated: redirected to login', () =>
        pm.expect(pm.response.code).to.eql(302) &&
        pm.expect(pm.response.headers.get('Location') || '').to.include('/login/'));
    language: text/javascript
settings:
  followRedirects: false
order: 2000
