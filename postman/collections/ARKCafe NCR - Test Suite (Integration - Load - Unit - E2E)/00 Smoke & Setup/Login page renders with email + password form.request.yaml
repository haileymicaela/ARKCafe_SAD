$kind: http-request
description: Seeds the csrftoken cookie used by every later POST (the collection script saves it to {{csrfToken}}).
url: "{{baseUrl}}/login"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login page returns 200', () => pm.expect(pm.response.code).to.eql(200));
      const body = pm.response.text();
      pm.test('Form has username (email) field', () => pm.expect(body).to.include('name="username"'));
      pm.test('Form has password field', () => pm.expect(body).to.include('name="password"'));
      pm.test('CSRF token input present', () => pm.expect(body).to.include('csrfmiddlewaretoken'));
      pm.test('csrftoken cookie was set', () => pm.expect(!!pm.cookies.get('csrftoken')).to.be.true);
    language: text/javascript
order: 2000
