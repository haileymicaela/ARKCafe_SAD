$kind: http-request
description: GET {{baseUrl}}/ - Django redirects anonymous users to the login view.
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Server responds', () => pm.response.code !== 0);
      pm.test('Anonymous root redirects to login (302)', () => pm.expect(pm.response.code).to.eql(302));
      const loc = pm.response.headers.get('Location') || '';
      pm.test('Redirect target is /login/', () => pm.expect(loc).to.include('/login/'));
    language: text/javascript
settings:
  followRedirects: false
order: 1000
