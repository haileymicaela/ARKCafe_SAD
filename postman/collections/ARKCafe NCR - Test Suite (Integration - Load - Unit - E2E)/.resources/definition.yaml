$kind: collection
name: ARKCafe NCR - Test Suite (Integration | Load | Unit | E2E)
description: |-
  Postman test suite for the ARKCafe / Crimson NCR Django project (existing features only).

  Folders:  
  00 Smoke & Setup - environment sanity checks  
  01 Unit Tests - single-request behavior (auth, security, validation, HTTP semantics)  
  02 Integration Tests - multi-request flows sharing state (sessions, CSRF, CRUD chains)  
  03 E2E Tests - complete user journeys for Admin and Staff roles  
  04 Load Tests - minimal folder meant to be replayed with Newman / Postman Performance

  The app uses Django session cookies + CSRF protection: login and every POST need the  
  csrftoken cookie and an X-CSRFToken header. The collection-level test script keeps  
  {{csrfToken}} fresh automatically - do not remove it.

  Use the 'ARKCafe - Local Dev' environment and set adminEmail/adminPassword/staffEmail/  
  staffPassword to real seeded accounts.
variables:
  csrfToken: ""
  projectId: ""
  departmentId: ""
  ncrId: ""
  projectCode: ""
  projectName: ""
  departmentName: ""
  uniq: ""
scripts:
  - type: http:afterResponse
    code: |-
      // Keep the Django CSRF token in sync with the csrftoken cookie
      try {
        const ck = pm.cookies.get('csrftoken');
        if (ck) pm.collectionVariables.set('csrfToken', ck);
      } catch (e) { /* cookie jar not available in this context */ }
    language: text/javascript
